[project]
name = "money"
version = "0.1.0"
description = "Budgeting and shared-expense tracking, API first, git-backed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

# Base dependencies are the CLI's only. `uvx --from git+... money` must not pull a web
# framework, so everything server-side lives in the `server` extra.
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "cryptography>=46.0.3",
]

[project.scripts]
money = "money_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "ty>=0.0.16",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["money", "money_cli"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Generated code is regenerated, not hand-wrapped; `money generate-cli --check` guards it.
# B006: Typer expresses a repeatable option as a list default; that is its documented API.
# F541: a generated f-string path may or may not interpolate, depending on the route.
"src/money_cli/generated.py" = ["E501", "B006", "F541"]
"src/money_cli/main.py" = ["B006"]
